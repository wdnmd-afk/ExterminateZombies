<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    background: radial-gradient(circle at 50% -10%, #17486a 0%, #071522 70%);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #bcd8ea;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .12em; }
  .hint { margin: 0; font-size: 12px; opacity: .55; }
  .stage {
    width: min(1040px, 100%);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 26px 60px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .09);
  }
  svg { display: block; width: 100%; height: auto; }

  /* 背景滚动：每层内容以 900 为周期重复一份，位移 -900 即可无缝循环 */
  @keyframes scrollX {
    from { transform: translateX(0); }
    to   { transform: translateX(-900px); }
  }
  .layer      { animation: scrollX linear infinite; }
  .l-isle     { animation-duration: 46s; }
  .l-sea      { animation-duration: 34s; }
  .l-cloud    { animation-duration: 28s; }
  .l-palm     { animation-duration: 6.2s; }
  .l-shore    { animation-duration: 3.4s; }
  .l-shoulder { animation-duration: 1.5s; }
  .l-streak   { animation-duration: 1.24s; }
  /* 路面虚线：靠 dashoffset 流动，比位移更省事且绝对无缝 */
  @keyframes dashFlow { to { stroke-dashoffset: -150px; } }
  .road-dash { animation: dashFlow .21s linear infinite; }
  @keyframes foamFlow { to { stroke-dashoffset: -120px; } }
  .foam { animation: foamFlow 2.6s linear infinite; }

  /* 整车上下颠簸，车与鸟一起动，避免相对错位 */
  @keyframes bob {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25%      { transform: translate(0, -2.6px) rotate(-.5deg); }
    50%      { transform: translate(0, .6px) rotate(0deg); }
    75%      { transform: translate(0, -1.6px) rotate(.4deg); }
  }
  .rig { animation: bob .45s ease-in-out infinite; transform-box: view-box; transform-origin: 430px 400px; }

  @keyframes twinkle {
    0%, 100% { opacity: .2; }
    50%      { opacity: .85; }
  }
  .sparkle { animation: twinkle 2.4s ease-in-out infinite; }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(0); }
    95.5%         { transform: scaleY(1); }
  }
  .eyelid { animation: blink 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: top; }

  @keyframes flutter {
    0%, 100% { transform: rotate(-7deg); }
    50%      { transform: rotate(8deg); }
  }
  .ribbon  { animation: flutter .62s ease-in-out infinite; transform-box: view-box; }
  .ribbon-a { transform-origin: 400px 200px; }
  .ribbon-b { transform-origin: 400px 200px; animation-delay: -.2s; }
</style>
</head>
<body>
<h1>鹈鹕骑自行车</h1>

<div class="stage">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只戴头盔的鹈鹕骑着自行车沿海岸公路飞驰的循环动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#3fa7d6"/>
      <stop offset=".55" stop-color="#8fd3e8"/>
      <stop offset="1"   stop-color="#ffe2b0"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1a6f9e"/>
      <stop offset="1"   stop-color="#3fb0c4"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f6e2b3"/>
      <stop offset="1"   stop-color="#e0c184"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#6e7480"/>
      <stop offset=".35" stop-color="#565c67"/>
      <stop offset="1"   stop-color="#3e434d"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0"   stop-color="#fff8d8"/>
      <stop offset=".62" stop-color="#ffd75e"/>
      <stop offset="1"   stop-color="#ffc63a"/>
    </radialGradient>
    <radialGradient id="belly" cx=".38" cy=".3" r=".85">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="1"   stop-color="#efe0c6"/>
    </radialGradient>

    <!-- 云：多个椭圆叠成一朵，比手写路径更稳 -->
    <g id="cloud" fill="#ffffff">
      <ellipse cx="30" cy="23" rx="30" ry="14"/>
      <ellipse cx="58" cy="14" rx="26" ry="18"/>
      <ellipse cx="86" cy="23" rx="24" ry="13"/>
      <rect x="2" y="18" width="106" height="11" rx="5.5"/>
    </g>

    <!-- 远处海鸟 -->
    <path id="bird" d="M -9 0 Q -4.5 -6 0 -1 Q 4.5 -6 9 0" fill="none"
          stroke="#2c4a5c" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 椰子树：弯曲树干 + 六片叶子 -->
    <g id="palm">
      <path d="M 0 0 Q -5 -34 -16 -62" fill="none" stroke="#7c5433" stroke-width="9" stroke-linecap="round"/>
      <path d="M 0 0 Q -5 -34 -16 -62" fill="none" stroke="#9a6b42" stroke-width="4.5" stroke-linecap="round"/>
      <g fill="#2f8f5b">
        <path d="M -16 -62 Q -46 -74 -60 -60 Q -40 -62 -16 -56 Z"/>
        <path d="M -16 -62 Q -44 -88 -58 -84 Q -36 -76 -16 -58 Z"/>
        <path d="M -16 -62 Q -22 -92 -8 -102 Q -14 -84 -12 -60 Z"/>
        <path d="M -16 -62 Q 8 -92 26 -88 Q 4 -78 -12 -58 Z"/>
        <path d="M -16 -62 Q 16 -74 30 -62 Q 8 -64 -14 -56 Z"/>
        <path d="M -16 -62 Q 12 -50 20 -38 Q 2 -50 -14 -54 Z"/>
      </g>
      <circle cx="-9" cy="-56" r="4" fill="#6b4a2c"/>
      <circle cx="-20" cy="-54" r="3.6" fill="#6b4a2c"/>
    </g>

    <!-- 路肩草丛 -->
    <g id="tuft" fill="none" stroke="#3f8f52" stroke-width="3" stroke-linecap="round">
      <path d="M 0 0 Q -3 -9 -8 -14"/>
      <path d="M 0 0 Q 0 -11 1 -18"/>
      <path d="M 0 0 Q 4 -9 10 -13"/>
    </g>

    <!-- 车轮辐条：原点在轮心 -->
    <g id="spokes" fill="none" stroke="#cfd6de" stroke-width="2.6">
      <path d="M 0 -46 V 46 M -46 0 H 46 M -32.5 -32.5 L 32.5 32.5 M -32.5 32.5 L 32.5 -32.5"/>
      <path d="M -23 -39.8 L 23 39.8 M -39.8 -23 L 39.8 23 M 23 -39.8 L -23 39.8 M 39.8 -23 L -39.8 23"
            opacity=".75"/>
    </g>

    <!-- 蹼足：原点在踝，脚掌朝 +x -->
    <g id="foot">
      <path d="M -8 -6 Q 6 -9 21 -5 Q 27 -2 24 4 Q 13 9 -3 8 Q -11 6 -8 -6 Z"
            fill="#f4a23e" stroke="#c06d14" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M 8 -6 L 10 7 M 16 -5 L 18 5" fill="none" stroke="#c06d14"
            stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
      <circle cx="-6" cy="-7" r="5.4" fill="#f4a23e" stroke="#c06d14" stroke-width="2.4"/>
    </g>
  </defs>
  <!-- ===== 天空 / 太阳 ===== -->
  <rect width="900" height="238" fill="url(#sky)"/>
  <g transform="translate(762 84)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="26s" repeatCount="indefinite"/>
      <g fill="#ffd75e" opacity=".55">
        <path id="ray" d="M -5 -40 L 5 -40 L 0 -66 Z"/>
        <use href="#ray" transform="rotate(30)"/>  <use href="#ray" transform="rotate(60)"/>
        <use href="#ray" transform="rotate(90)"/>  <use href="#ray" transform="rotate(120)"/>
        <use href="#ray" transform="rotate(150)"/> <use href="#ray" transform="rotate(180)"/>
        <use href="#ray" transform="rotate(210)"/> <use href="#ray" transform="rotate(240)"/>
        <use href="#ray" transform="rotate(270)"/> <use href="#ray" transform="rotate(300)"/>
        <use href="#ray" transform="rotate(330)"/>
      </g>
    </g>
    <circle r="36" fill="url(#sunGlow)"/>
  </g>

  <!-- ===== 远岛（最慢层） ===== -->
  <g class="layer l-isle" opacity=".45">
    <g id="isleSet" fill="#1f5c74">
      <path d="M 90 240 Q 150 196 214 240 Z"/>
      <path d="M 300 240 Q 336 214 372 240 Z"/>
      <path d="M 560 240 Q 630 190 706 240 Z"/>
      <path d="M 690 240 Q 730 210 772 240 Z"/>
    </g>
    <use href="#isleSet" x="900"/>
  </g>

  <!-- ===== 海面 + 波光 ===== -->
  <rect y="238" width="900" height="78" fill="url(#sea)"/>
  <g class="layer l-sea" stroke="#bdf1ff" stroke-width="3" stroke-linecap="round" fill="none">
    <g id="seaSet">
      <path class="sparkle" d="M 40 258 h 22"/>
      <path class="sparkle" style="animation-delay:-.5s"  d="M 132 274 h 30"/>
      <path class="sparkle" style="animation-delay:-1.1s" d="M 236 250 h 18"/>
      <path class="sparkle" style="animation-delay:-1.7s" d="M 318 288 h 26"/>
      <path class="sparkle" style="animation-delay:-.8s"  d="M 430 262 h 24"/>
      <path class="sparkle" style="animation-delay:-2s"   d="M 528 280 h 32"/>
      <path class="sparkle" style="animation-delay:-1.4s" d="M 636 252 h 20"/>
      <path class="sparkle" style="animation-delay:-.3s"  d="M 728 292 h 28"/>
      <path class="sparkle" style="animation-delay:-2.2s" d="M 820 268 h 22"/>
    </g>
    <use href="#seaSet" x="900"/>
  </g>

  <!-- ===== 云 + 海鸟 ===== -->
  <g class="layer l-cloud">
    <g id="cloudSet">
      <use href="#cloud" x="60"  y="34"  opacity=".92"/>
      <use href="#cloud" x="372" y="110" opacity=".7"  transform="scale(.78)"/>
      <use href="#cloud" x="520" y="26"  opacity=".85"/>
      <use href="#cloud" x="1194" y="194" opacity=".6" transform="scale(.62)"/>
      <use href="#bird" x="380" y="140" opacity=".6"/>
      <use href="#bird" x="412" y="128" opacity=".6"/>
      <use href="#bird" x="440" y="148" opacity=".6"/>
      <use href="#bird" x="700" y="70"  opacity=".45"/>
    </g>
    <use href="#cloudSet" x="900"/>
  </g>

  <!-- ===== 沙滩 + 浪花线 ===== -->
  <rect y="316" width="900" height="38" fill="url(#sand)"/>
  <path d="M 0 318 H 900" fill="none" stroke="#c9a463" stroke-width="2" opacity=".5"/>
  <path class="foam" d="M 0 316 H 900" fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="46 74" opacity=".8"/>
  <!-- ===== 椰子树（中景） ===== -->
  <g class="layer l-palm">
    <g id="palmSet">
      <use href="#palm" x="120" y="330"/>
      <!-- 缩放会连带缩放 x/y 平移，故坐标先除以缩放比，保证树根仍落在沙滩线上 -->
      <use href="#palm" x="414" y="379" transform="scale(.86)"/>
      <use href="#palm" x="612" y="332"/>
      <use href="#palm" x="870" y="357" transform="scale(.92)"/>
    </g>
    <use href="#palmSet" x="900"/>
  </g>

  <!-- ===== 路面 ===== -->
  <rect y="352" width="900" height="148" fill="url(#road)"/>
  <path d="M 0 353 H 900" fill="none" stroke="#8c929c" stroke-width="2.4" opacity=".8"/>
  <g class="layer l-shoulder">
    <g id="tuftSet">
      <use href="#tuft" x="46"  y="353"/> <use href="#tuft" x="168" y="352"/>
      <use href="#tuft" x="255" y="353"/> <use href="#tuft" x="392" y="352"/>
      <use href="#tuft" x="520" y="353"/> <use href="#tuft" x="648" y="352"/>
      <use href="#tuft" x="742" y="353"/> <use href="#tuft" x="860" y="352"/>
    </g>
    <use href="#tuftSet" x="900"/>
  </g>
  <path class="road-dash" d="M 0 468 H 900" fill="none" stroke="#f2e6b8"
        stroke-width="7" stroke-linecap="round" stroke-dasharray="90 60"/>
  <path class="road-dash" d="M 0 424 H 900" fill="none" stroke="#f2e6b8" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="90 60" opacity=".55"
        style="animation-duration:.3s"/>

  <!-- ===== 速度线（车身后方） ===== -->
  <g class="layer l-streak" fill="#ffffff">
    <g id="streakSet">
      <rect x="20"  y="376" width="120" height="4" rx="2" opacity=".2"/>
      <rect x="210" y="392" width="86"  height="3" rx="1.5" opacity=".16"/>
      <rect x="470" y="372" width="150" height="4" rx="2" opacity=".18"/>
      <rect x="700" y="398" width="104" height="3" rx="1.5" opacity=".14"/>
      <rect x="90"  y="452" width="170" height="5" rx="2.5" opacity=".22"/>
      <rect x="360" y="486" width="130" height="4" rx="2" opacity=".18"/>
      <rect x="600" y="462" width="190" height="5" rx="2.5" opacity=".2"/>
    </g>
    <use href="#streakSet" x="900"/>
  </g>

  <!-- 落地阴影 -->
  <ellipse cx="430" cy="404" rx="168" ry="15" fill="#000000" opacity=".26"/>
  <!-- ============ 车 + 鹈鹕（整体颠簸） ============ -->
  <g class="rig">

    <!-- ---- 车轮：后轮 (300,348) / 前轮 (560,348)，R=52 ---- -->
    <g transform="translate(300 348)">
      <circle r="52" fill="none" stroke="#25292f" stroke-width="9"/>
      <circle r="46" fill="none" stroke="#9aa3ad" stroke-width="3.4"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 0 0" to="360 0 0" dur=".45s" repeatCount="indefinite"/>
        <use href="#spokes"/>
      </g>
      <circle r="7" fill="#e8edf2" stroke="#3a4049" stroke-width="2.6"/>
    </g>

    <g transform="translate(560 348)">
      <circle r="52" fill="none" stroke="#25292f" stroke-width="9"/>
      <circle r="46" fill="none" stroke="#9aa3ad" stroke-width="3.4"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 0 0" to="360 0 0" dur=".45s" repeatCount="indefinite"/>
        <use href="#spokes"/>
      </g>
      <circle r="7" fill="#e8edf2" stroke="#3a4049" stroke-width="2.6"/>
    </g>

    <!-- ---- 远侧曲柄（在车架之后）：曲柄臂朝 -x，与近侧相差 180° ---- -->
    <g transform="translate(430 348)">
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        from="0 0 0" to="360 0 0" dur=".9s" repeatCount="indefinite"/>
      <path d="M 0 0 L -40 0" fill="none" stroke="#7a828d" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(-40 0)">
        <!-- 反向自转，保证踏板始终水平 -->
        <animateTransform attributeName="transform" type="rotate" additive="sum"
                          from="0 0 0" to="-360 0 0" dur=".9s" repeatCount="indefinite"/>
        <rect x="-13" y="-3.6" width="26" height="7.2" rx="3" fill="#4a5058"/>
      </g>
    </g>
    <!-- ---- 远侧腿（配色压暗，值序列相对近侧整体平移半个周期） ----
         髋 (372,258)，大腿/小腿各 74，脚踝落点由两段式 IK 反解，始终贴合脚踏 -->
    <g transform="translate(372 258)">
      <g>
        <animateTransform attributeName="transform" type="rotate" dur=".9s" repeatCount="indefinite"
          calcMode="linear"
          keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"
          values="27 0 0; 1.9 0 0; -18 0 0; -8.6 0 0; 16.7 0 0; 45.7 0 0; 50.2 0 0; 41.4 0 0; 27 0 0"/>
        <path d="M 0 0 L 74 0" fill="none" stroke="#cdbfa4" stroke-width="17" stroke-linecap="round"/>
        <g transform="translate(74 0)">
          <g>
            <animateTransform attributeName="transform" type="rotate" dur=".9s" repeatCount="indefinite"
              calcMode="linear"
              keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"
              values="103.4 0 0; 124.8 0 0; 117.6 0 0; 88.4 0 0; 51.8 0 0; 16.4 0 0; 31.6 0 0; 69 0 0; 103.4 0 0"/>
            <path d="M 0 0 L 74 0" fill="none" stroke="#d8a55f" stroke-width="12" stroke-linecap="round"/>
            <circle r="8" fill="#c4b299"/>
            <g transform="translate(74 0)">
              <g>
                <animateTransform attributeName="transform" type="rotate" dur=".9s" repeatCount="indefinite"
                  calcMode="linear"
                  keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"
                  values="-135 0 0; -135 0 0; -105 0 0; -80 0 0; -63.5 0 0; -54 0 0; -77 0 0; -110 0 0; -135 0 0"/>
                <use href="#foot" opacity=".82"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>
    <!-- ---- 车架：先描深色轮廓，再压亮色主体，得到贴纸式厚度感 ---- -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- 前叉 / 后叉 -->
      <path d="M 528 246 L 552 282 L 560 348" stroke="#7d2418" stroke-width="13"/>
      <path d="M 300 348 L 430 348 M 300 348 L 374 268" stroke="#7d2418" stroke-width="12"/>
      <!-- 主三角 -->
      <path d="M 430 348 L 374 268 L 528 246 L 430 348 Z" stroke="#7d2418" stroke-width="13"/>
      <!-- 亮色主体 -->
      <path d="M 528 246 L 552 282 L 560 348" stroke="#e2503f" stroke-width="8"/>
      <path d="M 300 348 L 430 348 M 300 348 L 374 268" stroke="#e2503f" stroke-width="7"/>
      <path d="M 430 348 L 374 268 L 528 246 L 430 348 Z" stroke="#e2503f" stroke-width="8"/>
      <!-- 高光 -->
      <path d="M 380 264 L 522 243" stroke="#ff8f7d" stroke-width="2.6" opacity=".75"/>
      <path d="M 436 342 L 524 250" stroke="#ff8f7d" stroke-width="2.6" opacity=".6"/>
    </g>

    <!-- 座管 + 车座 -->
    <path d="M 374 268 L 368 258" stroke="#3a4049" stroke-width="7" stroke-linecap="round"/>
    <path d="M 340 254 Q 358 248 386 256 Q 388 264 372 265 Q 350 266 340 262 Z"
          fill="#2f343b" stroke="#14171b" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- ---- 传动：链条 + 牙盘 + 飞轮 ---- -->
    <path d="M 300 339 L 430 328 M 300 357 L 430 368" fill="none" stroke="#33383f"
          stroke-width="4" stroke-dasharray="6 4"/>
    <g transform="translate(300 348)">
      <circle r="9.5" fill="#8b939d" stroke="#3a4049" stroke-width="2.6"/>
    </g>
    <g transform="translate(430 348)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0 0 0" to="360 0 0" dur=".9s" repeatCount="indefinite"/>
        <circle r="20" fill="#b9c1cb" stroke="#3a4049" stroke-width="3"/>
        <circle r="20" fill="none" stroke="#3a4049" stroke-width="5"
                stroke-dasharray="2.6 5.9" opacity=".9"/>
        <circle r="10" fill="#e8edf2" stroke="#3a4049" stroke-width="2.4"/>
      </g>
    </g>

    <!-- ---- 车把 ---- -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 528 246 L 536 228 Q 560 220 570 236 Q 574 250 562 254"
            stroke="#7d2418" stroke-width="13"/>
      <path d="M 528 246 L 536 228 Q 560 220 570 236 Q 574 250 562 254"
            stroke="#e2503f" stroke-width="8"/>
    </g>
    <circle cx="565" cy="242" r="8" fill="#2f343b"/>
    <!-- 车铃 -->
    <circle cx="542" cy="224" r="7" fill="#f2c14e" stroke="#9a7418" stroke-width="2.2"/>
    <circle cx="540" cy="222" r="2.2" fill="#fff3c4"/>
    <!-- ============ 鹈鹕 ============ -->
    <!-- 尾羽 -->
    <g fill="#e6d6ba" stroke="#c0ad8c" stroke-width="2.4" stroke-linejoin="round">
      <path d="M 288 208 Q 250 190 232 194 Q 254 208 282 218 Z"/>
      <path d="M 286 220 Q 242 214 224 222 Q 252 230 284 230 Z"/>
      <path d="M 288 232 Q 250 240 236 252 Q 264 250 292 240 Z"/>
    </g>

    <!-- 围巾飘带（在颈后，先画） -->
    <g fill="none" stroke-linecap="round">
      <path class="ribbon ribbon-a" d="M 400 200 Q 350 176 300 184 Q 274 188 258 176"
            stroke="#175f5c" stroke-width="12"/>
      <path class="ribbon ribbon-a" d="M 400 200 Q 350 176 300 184 Q 274 188 258 176"
            stroke="#2fa8a0" stroke-width="7.5"/>
      <path class="ribbon ribbon-b" d="M 400 204 Q 356 198 312 210 Q 288 216 270 210"
            stroke="#175f5c" stroke-width="11"/>
      <path class="ribbon ribbon-b" d="M 400 204 Q 356 198 312 210 Q 288 216 270 210"
            stroke="#2fa8a0" stroke-width="7"/>
    </g>

    <!-- 身体 -->
    <ellipse cx="338" cy="208" rx="74" ry="56" fill="url(#belly)"
             stroke="#c9b898" stroke-width="3"/>
    <ellipse cx="330" cy="226" rx="52" ry="32" fill="#ffffff" opacity=".55"/>
    <!-- 远侧折叠翅膀的暗示 -->
    <path d="M 296 186 Q 348 176 388 200 Q 350 216 306 212 Q 288 202 296 186 Z"
          fill="#e6d6ba" stroke="#c0ad8c" stroke-width="2.4" stroke-linejoin="round" opacity=".9"/>

    <!-- 颈 + 头（整体轻微点头，绕颈根 (388,196) 旋转） -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur=".9s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;.5;1" values="-2.6 388 196; 2.4 388 196; -2.6 388 196"
        keySplines=".42 0 .58 1;.42 0 .58 1"/>
      <g>
          <!-- 颈 -->
